  <!-- Tweaks defaults — editable by host. Defined here (before the pre-paint
       script) so theme/density/accent are applied before first paint. -->
  <script>
    window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
      "accent": "orange",
      "theme": "light",
      "density": "compact"
    }/*EDITMODE-END*/;
  </script>

  <!-- Pre-paint: apply theme + density + accent before React mounts. With the
       home prerendered, content is visible before the JS loads, so applying
       these here (not just in applyTweaks/useEffect) avoids a flash of wrong
       theme AND a density/accent layout shift (CLS) when React mounts. -->
  <script>
    (function() {
      var d = document.documentElement;
      var t = window.__TWEAKS__ || {};
      // Las animaciones de entrada arrancan en opacity 0 y sólo el JS las
      // revela. Esta clase es la que habilita ese estado inicial, así que sin
      // JS el HTML prerenderizado se ve entero (crawlers incluidos).
      d.classList.add('js');
      try {
        var saved = localStorage.getItem('quasor-theme');
        var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', saved || sys);
      } catch (e) {
        d.setAttribute('data-theme', t.theme || 'light');
      }
      var density = t.density || 'cozy';
      d.setAttribute('data-density', density);
      d.style.setProperty('--density', density === 'compact' ? '0.7' : '1');
      // Mirrors the ACCENTS map in src/components/Tweaks.jsx. The brand amber
      // already has its light/dark pair in src/index.css, so it only clears any
      // inline override; the alternates carry a theme-aware text colour.
      var dark = d.getAttribute('data-theme') === 'dark';
      var accents = {
        blue:  ['#5b8cff', '#7ea4ff', '#2e4fb4', '#8fb0ff'],
        green: ['#2fb27d', '#4ecb98', '#0f7a4a', '#3ecf8e']
      };
      var a = accents[t.accent];
      if (a) {
        d.style.setProperty('--accent', a[0]);
        d.style.setProperty('--accent-2', a[1]);
        d.style.setProperty('--accent-text', dark ? a[3] : a[2]);
      } else {
        d.style.removeProperty('--accent');
        d.style.removeProperty('--accent-2');
        d.style.removeProperty('--accent-text');
      }
    })();
  </script>
