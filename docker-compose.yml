# Quasor Landing — entorno local en Docker
#
# Puertos elegidos para NO chocar con la Quasor app (main_app_repo devcontainer),
# que ya ocupa: 5173 (frontend), 3001 (backend), 9229 (debug), 5433 (postgres).
#
#   dev     -> http://localhost:5180   (hot-reload)
#   preview -> http://localhost:4180   (build de producción servido, perfil "preview")
#
# Nota: usamos el mismo puerto adentro y afuera del contenedor (5180:5180 / 4180:4180)
# para que el websocket de HMR de Vite apunte al puerto correcto y no al del main app.

services:
  dev:
    image: node:22
    container_name: quasor-landing-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5180:5180"
    # El script "dev" ya trae --host; --port 5180 pisa el 5173 por defecto.
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev -- --port 5180"
    restart: unless-stopped

  preview:
    image: node:22
    container_name: quasor-landing-preview
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4180:4180"
    command: sh -c "[ -d node_modules ] || npm ci; npm run build && npm run preview -- --host --port 4180"
    profiles: ["preview"]
